# Production: docker compose up -d
# Needs API_KEY in .env (see .env.example). GPU: add -f docker-compose.gpu.yml.
services:
  oido-systemone:
    build: .
    image: oido-systemone:latest
    container_name: oido-systemone
    restart: unless-stopped
    # Loopback by default: put a TLS reverse proxy in front, or set BIND=0.0.0.0.
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      MODEL: ${MODEL:-minicpm5-2b,qwen3.5-4b}
      RATE_LIMIT: ${RATE_LIMIT:-10}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-5m}
      LOG_LEVEL: info
      DOCS: "false"
    volumes:
      - kronk:/home/app/.kronk # libs and models: survives image rebuilds
    # First start downloads about 4 GB: the image healthcheck allows 10 minutes.
    stop_grace_period: 30s # SHUTDOWN_TIMEOUT is 25s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  kronk:
