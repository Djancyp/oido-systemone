root = "."
tmp_dir = "build"

[build]
  args_bin = []
  bin = "./build/oido-systemone"
  cmd = "CGO_ENABLED=1 go build -o ./build/oido-systemone ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "build", "data"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "MODEL=qwen3.5-4b ./build/oido-systemone"  # dev: one model, fast reloads
  # full_bin = "MODEL=minicpm5-2b,qwen3.5-4b,qwen3-4b ./build/oido-systemone"  # all three models
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "6s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
